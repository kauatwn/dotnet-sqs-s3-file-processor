services:
  seq:
    image: datalust/seq:2025.2
    container_name: distributedfileprocessor-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=True
    ports:
      - "5341:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - seq_data:/data

  postgres:
    image: postgres:18-alpine
    container_name: distributedfileprocessor-postgres
    shm_size: 128mb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fileprocessor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fileprocessor_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-fileprocessor}"
    image: localstack/localstack-pro:2026.07.0
    ports:
      - "127.0.0.1:4566:4566" # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
      - "127.0.0.1:443:443" # LocalStack HTTPS Gateway
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test:
        ["CMD", "curl", "-s", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Ferramentas auxiliares para testes (mantidas sob profiles)
  csv-generator:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: distributedfileprocessor-csv-gen
    volumes:
      - .:/workspace
    working_dir: /workspace/tools
    profiles: ["tools"]
    command: ["dotnet", "run", "CsvGenerator.cs"]

  k6:
    image: grafana/k6:2.0.0
    container_name: distributedfileprocessor-k6
    profiles: ["loadtest"]
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - ./k6:/scripts
      - ./tools/output:/data
    working_dir: /scripts
    command: ["run", "upload-documents-stress.js"]

volumes:
  postgres_data:
  seq_data:
