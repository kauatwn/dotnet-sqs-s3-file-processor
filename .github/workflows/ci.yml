name: "Continuous Integration"

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_VERSION: "10.0.x"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-dotnet:
    name: "Check .NET Formatting"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup .NET 🟣"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Check Format 🎨"
        run: dotnet format DistributedFileProcessor.slnx --verify-no-changes --verbosity diagnostic

  lint-terraform:
    name: "Validate Terraform IaC"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Terraform 🌍"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: "Check Terraform Formatting 📐"
        run: terraform fmt -check -recursive infra/

      - name: "Validate Dev Environment 🧪"
        working-directory: infra/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  build:
    name: "Build Solution"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup .NET 🟣"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Cache NuGet packages 📦"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Restore dependencies 📦"
        run: dotnet restore DistributedFileProcessor.slnx

      - name: "Build Solution 🔨"
        run: dotnet build DistributedFileProcessor.slnx --no-restore --configuration Release

  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup .NET 🟣"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Cache NuGet packages 📦"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Restore dependencies 📦"
        run: dotnet restore tests/DistributedFileProcessor.UnitTests/DistributedFileProcessor.UnitTests.csproj

      - name: "Run Unit Tests 🧪"
        run: |
          dotnet test \
            tests/DistributedFileProcessor.UnitTests/DistributedFileProcessor.UnitTests.csproj \
            --no-restore \
            --configuration Release \
            --verbosity normal

  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup .NET 🟣"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Cache NuGet packages 📦"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Restore dependencies 📦"
        run: dotnet restore tests/DistributedFileProcessor.IntegrationTests/DistributedFileProcessor.IntegrationTests.csproj

      - name: "Run Integration Tests 🔗"
        run: |
          dotnet test \
            tests/DistributedFileProcessor.IntegrationTests/DistributedFileProcessor.IntegrationTests.csproj \
            --no-restore \
            --configuration Release \
            --verbosity normal

  sonar:
    name: "Code Quality - SonarQube"
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Setup JDK 17 ☕"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: "temurin"

      - name: "Setup .NET 🟣"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Cache NuGet packages 📦"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Cache SonarQube Cloud packages 📊"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: "Cache SonarQube Cloud scanner 🔍"
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: "Install SonarQube Cloud scanner 🔧"
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: "Restore dependencies 📦"
        run: dotnet restore DistributedFileProcessor.slnx

      - name: "Begin SonarQube Cloud Analysis 🔍"
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin \
            /k:"kauatwn_DistributedFileProcessor" \
            /o:"kauatwn" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.projectBaseDir="${{ github.workspace }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**Program.cs,**/Configurations/**,**/Migrations/**,**/k6/**"

      - name: "Build Solution 🔨"
        run: dotnet build DistributedFileProcessor.slnx --no-restore --configuration Release

      - name: "Run Unit Tests for Coverage 🧪"
        run: |
          dotnet test DistributedFileProcessor.slnx \
            --no-build \
            --configuration Release \
            --filter "Category=Unit" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: "End SonarQube Cloud Analysis 📊"
        run: ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  docker-build:
    name: "Docker Build - ${{ matrix.service.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: "api"
            dockerfile: "src/DistributedFileProcessor.API/Dockerfile"
            cache-scope: "api-build"

          - name: "worker"
            dockerfile: "src/DistributedFileProcessor.Worker/Dockerfile"
            cache-scope: "worker-build"

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Docker Buildx 🐳"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: network=host

      - name: "Build Docker Image 🏗️"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: distributedfileprocessor-${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.cache-scope }}
