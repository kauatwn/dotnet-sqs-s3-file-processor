name: k6 Load Test

on:
  workflow_run:
    workflows: ["CI (Build, Test, Analyze & Docker)"]
    types:
      - completed

jobs:
  k6-load-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Execute k6 Load Test with Cloud Streaming
    runs-on: ubuntu-24.04

    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
      K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
      K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Infrastructure (LocalStack, Postgres, API, Worker)
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.override.yml \
            up -d --build

      - name: Wait for Services Initialization
        run: sleep 50

      - name: Warm-up API (Bypass .NET Cold Start)
        run: |
          echo "Warming up the API..."
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" -X POST http://localhost:8080/api/documents/upload \
            -H "Content-Type: application/json" \
            -d '{"fileName": "warmup-dummy-request.csv"}'
          echo "Warm-up complete!"

      - name: Generate CSV Payload
        run: docker compose run --rm csv-generator

      - name: Run k6 and Stream to Grafana Cloud
        run: |
          docker compose --profile loadtest run --rm \
            -e K6_CLOUD_TOKEN=$K6_CLOUD_TOKEN \
            -e K6_CLOUD_PROJECT_ID=$K6_CLOUD_PROJECT_ID \
            -e K6_CLOUD_STACK_ID=$K6_CLOUD_STACK_ID \
            k6 cloud run --local-execution /scripts/upload-documents-stress.js

      - name: Show LocalStack Logs
        if: failure()
        run: docker compose logs localstack

      - name: Show All Container Status
        if: failure()
        run: docker compose ps

      - name: Tear Down Infrastructure
        if: always()
        run: docker compose down -v
