name: CI (Build, Test, Analyze & Docker)

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-24.04

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      COVERAGE_ARGS: '--collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover'

    permissions:
      contents: read # Access to check out code and install dependencies

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: "temurin" # Alternative distribution options are available.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 #v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Restore dependencies
        run: dotnet restore DistributedFileProcessor.slnx

      - name: Begin SonarQube Cloud Analysis
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin \
          /k:"kauatwn_DistributedFileProcessor" \
          /o:"kauatwn" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.projectBaseDir="${{ github.workspace }}" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
          /d:sonar.coverage.exclusions="**Program.cs,**/Configurations/**,**/Migrations/**,**/k6/**"

      - name: Build
        run: dotnet build DistributedFileProcessor.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test DistributedFileProcessor.slnx --no-build --configuration Release --filter "Category=Unit" ${{ env.COVERAGE_ARGS }}

      - name: Run Integration Tests
        run: dotnet test DistributedFileProcessor.slnx --no-build --configuration Release --filter "Category=Integration" ${{ env.COVERAGE_ARGS }}

      - name: End SonarQube Cloud Analysis
        run: ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 #v4.1.0

      - name: Docker Build Check - API
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf #v7.2.0
        with:
          context: .
          file: src/DistributedFileProcessor.API/Dockerfile
          push: false
          tags: distributed-file-processor-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Build Check - Worker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf #v7.2.0
        with:
          context: .
          file: src/DistributedFileProcessor.Worker/Dockerfile
          push: false
          tags: distributed-file-processor-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
