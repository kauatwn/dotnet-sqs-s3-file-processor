name: Performance & Stress Testing (k6)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["LocalStack Deployment (Dev)"]
    types:
      - completed

env:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"
  LOCALSTACK_ENDPOINT: "http://127.0.0.1:4566"
  IMAGE_TAG: ${{ github.sha }}
  K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
  K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
  K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}

jobs:
  k6-load-test:
    name: Execute k6 Load Test with Grafana Cloud Streaming
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Start LocalStack 🐳
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          image-tag: "2026.07.0"
          install-awslocal: "true"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Setup Terraform 🛠️
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init 🚀
        working-directory: infra/environments/dev
        run: terraform init -upgrade

      - name: Terraform Apply (Target ECR Repositories) 📦
        working-directory: infra/environments/dev
        run: |
          terraform apply \
            -target="module.ecr_api.aws_ecr_repository.this" \
            -target="module.ecr_worker.aws_ecr_repository.this" \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -auto-approve

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host

      - name: Build and Push API Docker Image 🐳
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/DistributedFileProcessor.API/Dockerfile
          push: true
          tags: |
            000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/fileprocessor-api-dev:${{ env.IMAGE_TAG }}
            000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/fileprocessor-api-dev:latest
          platforms: linux/amd64

      - name: Build and Push Worker Docker Image 🐳
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/DistributedFileProcessor.Worker/Dockerfile
          push: true
          tags: |
            000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/fileprocessor-worker-dev:${{ env.IMAGE_TAG }}
            000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/fileprocessor-worker-dev:latest
          platforms: linux/amd64

      - name: Terraform Apply (Full Infrastructure) 🏗️
        working-directory: infra/environments/dev
        run: |
          terraform apply \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -auto-approve

      - name: Wait for Infrastructure Stabilization ⏳
        run: sleep 10

      - name: Warm-up API (Bypass .NET Cold Start) ⚡
        run: |
          echo "Warming up the API..."
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" -X POST "http://localhost:8080/api/documents/upload" \
            -H "Content-Type: application/json" \
            -d '{"fileName": "warmup-dummy-request.csv"}'
          echo "Warm-up complete!"

      - name: Generate CSV Payload 📄
        run: docker compose --profile tools run csv-generator

      - name: Run k6 and Stream to Grafana Cloud 📊
        run: |
          docker compose --profile loadtest run --rm \
            -e BASE_URL=http://host.docker.internal:8080 \
            -e K6_CLOUD_TOKEN=$K6_CLOUD_TOKEN \
            -e K6_CLOUD_PROJECT_ID=$K6_CLOUD_PROJECT_ID \
            -e K6_CLOUD_STACK_ID=$K6_CLOUD_STACK_ID \
            k6 cloud run --local-execution /scripts/upload-documents-stress.js
