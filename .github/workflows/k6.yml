name: Performance & Stress Testing (k6)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["LocalStack Deployment (Dev)"]
    types:
      - completed

env:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"
  LOCALSTACK_ENDPOINT: "http://127.0.0.1:4566"
  IMAGE_TAG: ${{ github.sha }}
  K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
  K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
  K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}

jobs:
  k6-load-test:
    name: Execute k6 Load Test with Grafana Cloud Streaming
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run k6 Load Test
        run: |
          docker run --rm \
            --network host \
            -e K6_CLOUD_TOKEN="${{ secrets.K6_CLOUD_TOKEN }}" \
            -e K6_CLOUD_PROJECT_ID="${{ secrets.K6_CLOUD_PROJECT_ID }}" \
            -e K6_CLOUD_STACK_ID="${{ secrets.K6_CLOUD_STACK_ID }}" \
            -v ${{ github.workspace }}/k6:/scripts \
            -v ${{ github.workspace }}/tools/output:/data \
            grafana/k6:latest cloud run --local-execution /scripts/upload-documents-stress.js
